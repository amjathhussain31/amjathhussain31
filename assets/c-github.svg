<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1428"/><stop offset="1" stop-color="#080d1b"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/></linearGradient><radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".22"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient><radialGradient id="gl2" cx="0" cy="1" r="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".18"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>
.sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@keyframes ring{to{stroke-dashoffset:-1000}}
@keyframes inUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes glint{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(800px);opacity:0}}
@keyframes pulse{50%{opacity:.45}}
.ring{fill:none;stroke-width:2.2;stroke-dasharray:150 850;stroke-linecap:round;animation:ring 8s linear infinite}
.in{animation:inUp .8s ease-out backwards}
.bob{animation:bob 4.5s ease-in-out infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="240" height="60" rx="30" fill="url(#bg)"/><rect width="240" height="60" rx="30" fill="url(#gl)"/><rect width="240" height="60" rx="30" fill="url(#gl2)"/><rect x="1" y="1" width="238" height="58" rx="29" fill="none" stroke="#1e293b" stroke-width="1.4"/><rect x="1" y="1" width="238" height="58" rx="29" pathLength="1000" class="ring" stroke="url(#g)"/><g transform="translate(40 30) scale(.8)"><g fill="none" stroke="#a855f7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="-8" cy="-9" r="3.500"/><circle cx="-8" cy="10" r="3.500"/><circle cx="9" cy="-3" r="3.500"/><path d="M-8 -5.500 V6.500 M9 0.500 C9 7 -8 3 -8 6"/></g></g><text x="72" y="37" class="sans" font-size="19" font-weight="750" fill="#f1f5f9">GitHub</text><g transform="translate(206 30)" fill="none" stroke="#a855f7" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M-4 -6 L3 0 L-4 6" class="pulse"/></g></svg>