<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120" role="presentation"><defs></defs><style>
.sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@keyframes ring{to{stroke-dashoffset:-1000}}
@keyframes inUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes glint{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(800px);opacity:0}}
@keyframes pulse{50%{opacity:.45}}
.ring{fill:none;stroke-width:2.2;stroke-dasharray:150 850;stroke-linecap:round;animation:ring 8s linear infinite}
.in{animation:inUp .8s ease-out backwards}
.bob{animation:bob 4.5s ease-in-out infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes drift{to{transform:translateX(-660px)}} .w1{animation:drift 18s linear infinite} .w2{animation:drift 28s linear infinite reverse}</style><defs><linearGradient id="wf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><g class="w2" opacity=".35"><path d="M0 60 C110 20 220 100 330 60 S550 20 660 60 S880 100 990 60 S1210 20 1320 60 S1540 100 1650 60 S1870 20 1980 60 V120 H0 Z" fill="url(#wf)" transform="translate(-330 14)"/></g><g class="w1" opacity=".75"><path d="M0 60 C110 20 220 100 330 60 S550 20 660 60 S880 100 990 60 S1210 20 1320 60 S1540 100 1650 60 S1870 20 1980 60 V120 H0 Z" fill="url(#wf)"/></g></svg>