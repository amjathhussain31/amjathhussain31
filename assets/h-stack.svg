<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 60" width="880" height="60" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1428"/><stop offset="1" stop-color="#080d1b"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="gl2" cx="0" cy="1" r="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".18"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>
.sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
@keyframes ring{to{stroke-dashoffset:-1000}}
@keyframes inUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-2.5px)}}
@keyframes glint{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(800px);opacity:0}}
@keyframes pulse{50%{opacity:.45}}
.ring{fill:none;stroke-width:2.2;stroke-dasharray:150 850;stroke-linecap:round;animation:ring 8s linear infinite}
.in{animation:inUp .8s ease-out backwards}
.bob{animation:bob 4.5s ease-in-out infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="880" height="60" rx="14" fill="url(#bg)"/><rect width="880" height="60" rx="14" fill="url(#gl)"/><rect width="880" height="60" rx="14" fill="url(#gl2)"/><rect x="1" y="1" width="878" height="58" rx="13" fill="none" stroke="#1e293b" stroke-width="1.4"/><rect x="1" y="1" width="878" height="58" rx="13" pathLength="1000" class="ring" stroke="url(#g)"/><rect x="22" y="16" width="4" height="28" rx="2" fill="url(#g)"/><text x="40" y="37" class="mono" font-size="15" font-weight="600" fill="#22d3ee" fill-opacity=".9">05</text><text x="80" y="39" class="sans" font-size="26" font-weight="800" fill="#f1f5f9" letter-spacing="-.3">Technology Stack</text><g fill="#22d3ee" fill-opacity=".5"><circle cx="820" cy="30" r="2.200" class="pulse" style="animation-delay:0.0s"/><circle cx="834" cy="30" r="2.200" class="pulse" style="animation-delay:0.4s"/><circle cx="848" cy="30" r="2.200" class="pulse" style="animation-delay:0.8s"/><circle cx="862" cy="30" r="2.200" class="pulse" style="animation-delay:1.2000000000000002s"/></g><g transform="translate(40 57)"><circle r="2.500" fill="#fff" filter="url(#soft)" style="animation:glint 6s ease-in-out infinite"/></g></svg>